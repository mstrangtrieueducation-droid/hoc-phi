<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<style id="first-frame">html{background:#f4f6f9}html[data-theme=dark]{background:#0f141b}</style>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F172A">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com; connect-src https://script.google.com https://script.googleusercontent.com https://sheets.googleapis.com https://www.googleapis.com https://img.vietqr.io https://oauth2.googleapis.com https://accounts.google.com; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://accounts.google.com https://fonts.googleapis.com; font-src https://fonts.gstatic.com; frame-src https://accounts.google.com">
<title>Học phí</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --ink: #18212f; --muted: #5d6b7e; --line: #e2e7ee; --soft: #eef2f7;
    --brand: #0b5394; --brand-soft: #e6f0f9; --on-brand: #ffffff;
    --ok: #12703a; --ok-soft: #e4f4ea; --warn: #9a5b00; --warn-soft: #fdf1dc; --bad: #b3261e; --bad-soft: #fbe9e7;
    --shadow: 0 1px 2px rgba(24, 33, 47, .06), 0 4px 16px rgba(24, 33, 47, .05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10151c; --card: #1a212b; --ink: #e8edf3; --muted: #9aa8b8; --line: #2c3643; --soft: #232c38;
      --brand: #6aa9e4; --brand-soft: #1d3247; --on-brand: #0d1a26;
      --ok: #6fd093; --ok-soft: #173325; --warn: #ecb45c; --warn-soft: #3a2c13; --bad: #f2938b; --bad-soft: #3d1f1c;
      --shadow: none;
    }
  }
  /* A choice made on this device beats the system setting; phones start light. */
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f4f6f9; --card: #ffffff; --ink: #18212f; --muted: #5d6b7e; --line: #e2e7ee; --soft: #eef2f7;
    --brand: #0b5394; --brand-soft: #e6f0f9; --on-brand: #ffffff;
    --ok: #12703a; --ok-soft: #e4f4ea; --warn: #9a5b00; --warn-soft: #fdf1dc; --bad: #b3261e; --bad-soft: #fbe9e7;
    --shadow: 0 1px 2px rgba(24, 33, 47, .06), 0 4px 16px rgba(24, 33, 47, .05);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #10151c; --card: #1a212b; --ink: #e8edf3; --muted: #9aa8b8; --line: #2c3643; --soft: #232c38;
    --brand: #6aa9e4; --brand-soft: #1d3247; --on-brand: #0d1a26;
    --ok: #6fd093; --ok-soft: #173325; --warn: #ecb45c; --warn-soft: #3a2c13; --bad: #f2938b; --bad-soft: #3d1f1c;
    --shadow: none;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 "Be Vietnam Pro", Arial, sans-serif; font-variant-numeric: tabular-nums; }
  [hidden] { display: none !important; }
  h1, h2, p { margin: 0; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { min-height: 44px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); font-weight: 500; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button:disabled { opacity: .55; cursor: default; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); font-weight: 600; }
  .primary:hover { border-color: var(--brand); filter: brightness(1.08); }
  .quiet { border-color: transparent; background: none; color: var(--brand); padding: 6px 8px; min-height: 36px; }
  .quiet:hover { border-color: transparent; background: var(--brand-soft); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }

  /* Sign-in */
  #login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .login-box { width: 100%; max-width: 380px; padding: 32px 24px; text-align: center; }
  .logo { width: 52px; height: 52px; margin: 0 auto 16px; border-radius: 14px; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; font-size: 24px; font-weight: 700; }
  .login-box h1 { font-size: 22px; font-weight: 700; }
  .login-box p { color: var(--muted); margin: 8px 0 20px; }
  #btnLogin { width: 100%; min-height: 48px; }
  #loginMsg { margin: 12px 0 0; min-height: 22px; font-size: 14px; color: var(--bad); }

  /* Shell */
  header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1120px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; gap: 8px; }
  .brand { border: 0; background: none; padding: 4px 8px 4px 0; display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; color: var(--brand); }
  .brand:hover { border: 0; }
  .brand i { width: 30px; height: 30px; border-radius: 9px; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; font-style: normal; font-size: 15px; }
  #lop { flex: 0 1 190px; min-width: 0; min-height: 44px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); font-weight: 600; }
  .spacer { flex: 1; }
  main { max-width: 1120px; margin: 0 auto; padding: 16px 16px 48px; }
  .notices { display: grid; gap: 8px; margin-bottom: 12px; }
  .notices:empty { display: none; }
  .notice { padding: 10px 12px; border-radius: 10px; font-size: 14px; background: var(--soft); color: var(--muted); }
  .notice.warn { background: var(--warn-soft); color: var(--warn); }
  .notice.err { background: var(--bad-soft); color: var(--bad); }

  /* Overview */
  .page-title { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .page-title h1 { font-size: 22px; font-weight: 700; }
  .sub { color: var(--muted); font-size: 14px; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 16px; }
  .stat { padding: 12px 14px; }
  .stat b { display: block; font-size: 20px; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
  .stat span { color: var(--muted); font-size: 13px; }
  .stat.alert b { color: var(--warn); }
  .search { width: 100%; min-height: 44px; margin-bottom: 12px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
  .classes { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
  .class { display: block; width: 100%; padding: 14px; text-align: left; font-weight: 400; border-radius: 14px; box-shadow: var(--shadow); }
  .class .top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .class b { font-size: 16px; font-weight: 700; }
  .class small { color: var(--muted); font-size: 13px; }
  .track { height: 6px; margin: 10px 0 8px; border-radius: 3px; background: var(--soft); overflow: hidden; }
  .track i { display: block; height: 100%; border-radius: 3px; background: var(--ok); }
  .class .low { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 8px; font-size: 13px; color: var(--muted); }
  .class .low strong { color: var(--ink); font-weight: 600; }
  .class .flag { width: 100%; color: var(--warn); font-weight: 500; }

  /* Class page */
  .class-head { padding: 16px; margin-bottom: 12px; }
  .class-head h1 { font-size: 20px; font-weight: 700; }
  .class-head .nums { display: flex; flex-wrap: wrap; gap: 4px 20px; margin-top: 2px; font-size: 14px; color: var(--muted); }
  .class-head .nums strong { color: var(--ink); font-weight: 600; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; margin-bottom: 12px; border-radius: 12px; background: var(--soft); }
  .seg button { border: 0; background: none; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); font-weight: 600; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .filters button { min-height: 36px; padding: 4px 12px; border-radius: 18px; font-size: 14px; }
  .filters button[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); font-weight: 600; }

  /* Fees */
  .row { padding: 12px 14px; margin-bottom: 8px; border-radius: 12px; }
  .row .r1 { display: flex; justify-content: space-between; gap: 12px; }
  .row .nm { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
  .row .amt { white-space: nowrap; font-weight: 600; }
  .row .r2 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
  .chip { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 13px; font-weight: 500; background: var(--warn-soft); color: var(--warn); }
  .chip.ok { background: var(--ok-soft); color: var(--ok); }
  .chip.idle { background: var(--soft); color: var(--muted); }
  .fill { flex: 1; min-width: 8px; }
  .r2 input[type=date] { min-height: 44px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
  .tick { background: var(--ok); border-color: var(--ok); color: var(--card); font-weight: 600; }
  .tick:hover { border-color: var(--ok); filter: brightness(1.08); }
  .warn-line { margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); font-size: 13px; }
  .warn-line button { margin-left: 4px; color: var(--warn); text-decoration: underline; min-height: 28px; padding: 0 4px; }
  .empty { padding: 48px 16px; text-align: center; color: var(--muted); }

  /* Zalo */
  .zalo { display: grid; gap: 12px; }
  .people { display: none; padding: 6px; max-height: 76vh; overflow-y: auto; }
  .people button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; border: 0; background: none; border-radius: 8px; text-align: left; font-weight: 400; font-size: 14px; }
  .people button:hover { background: var(--soft); }
  .people button[aria-current="true"] { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
  .people .n { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .people .m { flex: none; font-size: 12px; font-weight: 600; }
  .people .m.done { color: var(--ok); }
  .people .m.warn { color: var(--warn); }
  .people .m.none { color: var(--muted); font-weight: 400; }
  #chon { width: 100%; min-height: 44px; padding: 6px 10px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
  .stage { min-width: 0; }
  .who { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-bottom: 8px; }
  .who b { font-size: 16px; font-weight: 700; }
  .who .tag { font-size: 12px; color: var(--warn); }
  .who .quiet { margin-left: auto; }
  .pv { max-height: 56vh; overflow-y: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--soft); min-height: 220px; }
  .pv img { width: 100%; display: block; }
  .one { width: 100%; min-height: 54px; margin: 10px 0 8px; font-size: 16px; }
  .nav { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .nav button { padding: 6px 4px; font-size: 14px; }
  .st { min-height: 22px; margin-top: 8px; font-size: 14px; }
  .count { margin-top: 8px; color: var(--muted); font-size: 13px; text-align: center; }

  dialog { width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 32px); border: 1px solid var(--line); border-radius: 16px; padding: 18px; background: var(--card); color: var(--ink); }
  dialog::backdrop { background: rgba(10, 15, 22, .45); }
  dialog h2 { font-size: 17px; font-weight: 700; margin-bottom: 12px; }
  dialog label { display: block; margin: 10px 0 4px; font-size: 14px; font-weight: 500; }
  dialog textarea { width: 100%; height: 34vh; padding: 10px; font-size: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
  dialog input { width: 100%; min-height: 44px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
  .hint { margin-top: 4px; font-size: 13px; color: var(--warn); }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .acts button { flex: 1 1 130px; }
  #tlForm select { width: 100%; min-height: 44px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
  #tlForm .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #tlStatus { color: var(--muted); white-space: pre-line; }
  #edErr, #dvErr, #tlErr { min-height: 20px; margin-top: 8px; font-size: 14px; color: var(--bad); }
  .section { font-size: 16px; font-weight: 700; margin: 18px 0 8px; }
  .empty.small { padding: 16px; }
  .books { display: grid; gap: 6px; }
  .books select { width: 100%; min-height: 44px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
  .row .primary { min-height: 40px; }
  #btnMoves, #btnCal { white-space: nowrap; }
  .due-banner { display: block; width: 100%; margin-bottom: 12px; padding: 12px 14px; text-align: left; font-weight: 400; background: var(--warn-soft); color: var(--warn); border-color: var(--warn-soft); }
  .due-banner strong { font-weight: 700; }
  .cal-row { border: 1px solid var(--line); background: var(--card); }
  .tabs { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--soft); }
  .tabs button { min-height: 40px; padding: 6px 12px; border: 0; background: none; color: var(--muted); white-space: nowrap; }
  .tabs button:hover { color: var(--ink); }
  .tabs button[aria-current="true"] { background: var(--brand); color: var(--on-brand); font-weight: 600; }
  .tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
  .tile { display: block; min-height: 88px; padding: 12px 14px; text-align: left; font-weight: 400; border-radius: 14px; box-shadow: var(--shadow); }
  .tile b { display: block; font-size: 28px; font-weight: 700; line-height: 1.2; }
  .tile span { color: var(--muted); font-size: 13px; }
  .tile.alert { background: var(--warn-soft); border-color: var(--warn-soft); }
  .tile.alert b { color: var(--warn); }
  .act { min-height: 38px; padding: 4px 12px; border-color: var(--brand-soft); background: var(--brand-soft); color: var(--brand); font-size: 14px; font-weight: 600; }
  .act:hover { border-color: var(--brand); }
  .card-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
  .card-actions .act { padding: 4px 2px; }
  .class .note { width: 100%; color: var(--muted); }
  .cal-row .ack { padding-top: 8px; border-top: 1px solid var(--line); }
  .cal-row .top { margin-bottom: 6px; align-items: center; }
  .cal-line { font-size: 14px; }
  .cal-line.sub { font-size: 13px; }
  .cal-line:empty { display: none; }
  .cal-line strong { font-weight: 600; }
  .chip.warn-soft { background: var(--brand-soft); color: var(--brand); }
  .sent { color: var(--ok); font-size: 13px; font-weight: 500; }
  .cal-line.sent { margin-top: 2px; }
  .row .r3, .stage .r3 { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 4px; min-height: 28px; font-size: 13px; }
  .r3 .quiet, .r3 .act { min-height: 32px; padding: 2px 8px; font-size: 13px; }
  .ack { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 14px; font-weight: 500; cursor: pointer; }
  .ack input { width: 20px; height: 20px; flex: none; accent-color: var(--ok); }
  .panel { padding: 14px 16px; margin-bottom: 12px; }
  .panel-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .lessons { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 2px 16px; margin: 10px 0 8px; padding-left: 28px; font-size: 14px; }
  .lessons .past { color: var(--muted); }
  .lessons .planned { font-style: italic; }
  .panel .books select { background: var(--card); }
  .hist { padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .hist summary { cursor: pointer; font-weight: 500; }
  .detail { margin: 6px 0 0; font: inherit; font-size: 13px; color: var(--muted); white-space: pre-wrap; }
  .log { margin: 6px 0 0; padding-left: 18px; font-size: 13px; color: var(--muted); max-height: 240px; overflow-y: auto; }
  #reload, #btnOut { white-space: nowrap; flex: none; }
  .brand { flex: none; white-space: nowrap; }
  @media (max-width: 960px) {
    .bar { flex-wrap: wrap; }
    .tabs { order: 5; flex: 1 1 100%; }
    .tabs button { flex: 1; padding: 6px 2px; font-size: 14px; }
    #lop { flex: 1 1 120px; }
    .spacer { display: none; }
  }
  @media (max-width: 640px) {
    .tabs button { font-size: 13px; }
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stats { grid-template-columns: 1fr; }
  }

  @media (min-width: 860px) {
    .zalo { grid-template-columns: 300px minmax(0, 1fr); align-items: start; }
    .people { display: block; position: sticky; top: 76px; }
    #chon { display: none; }
    .pv { max-height: 62vh; }
    .fee-list { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  }
  @media (max-width: 420px) {
    .stat b { font-size: 16px; }
    .stat { padding: 10px; }
    .brand span { display: none; }
  }
  @media (prefers-reduced-motion: no-preference) { .track i { transition: width .3s; } }
  /* Đợt học: facts on top, then lessons and history beside books and the sent log. */
  .facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 12px; }
  .fact { display: flex; flex-direction: column; gap: 2px; padding: 12px 16px; border-left: 1px solid var(--line); min-width: 0; }
  .fact:first-child { border-left: 0; }
  .fact .lab { font-size: 13px; color: var(--muted); }
  .fact b { font-size: 19px; font-weight: 700; line-height: 1.3; }
  .fact .track { margin-top: 6px; }
  .dot-grid { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 12px; align-items: start; }
  .dot-col { min-width: 0; }
  .les { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; margin: 10px 0; padding: 0; }
  .les li { position: relative; display: flex; flex-direction: column; padding: 6px 8px; border: 1px solid var(--line); border-radius: 10px; }
  .les b { font-size: 15px; font-weight: 600; }
  .les .no { position: absolute; top: 5px; right: 8px; font-size: 11px; color: var(--muted); }
  .les .wd { font-size: 12px; color: var(--muted); }
  .les .past { background: var(--soft); border-color: transparent; }
  .les .past b { color: var(--muted); font-weight: 500; }
  .les .next { background: var(--brand-soft); border-color: var(--brand); }
  .les .next b { color: var(--brand); }
  .les .planned { border-style: dashed; border-color: var(--muted); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 6px; font-size: 12px; color: var(--muted); }
  .legend .k::before { content: ""; display: inline-block; width: 12px; height: 12px; margin-right: 5px; border: 1px solid var(--line); border-radius: 3px; vertical-align: -1px; }
  .legend .past::before { background: var(--soft); border-color: transparent; }
  .legend .next::before { background: var(--brand-soft); border-color: var(--brand); }
  .legend .planned::before { border-style: dashed; border-color: var(--muted); }
  .hist-row { display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; }
  .hist-row strong { font-weight: 600; }
  .hist-row::marker { color: var(--muted); }
  .kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; margin: 6px 0; font-size: 14px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  .class .kv { font-size: 13px; margin: 8px 0; }
  .sent-log { display: grid; gap: 8px; max-height: 320px; overflow-y: auto; margin-top: 6px; font-size: 14px; }
  .sent-row { padding-top: 8px; border-top: 1px solid var(--line); }
  .sent-row:first-child { padding-top: 0; border-top: 0; }
  .sent-row b { font-weight: 600; }
  /* Lists of names. */
  .group { margin-top: 8px; }
  .tt-list { overflow: hidden; }
  .tt-head, .tt-row { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1.5fr) minmax(0, 1.1fr) minmax(0, 1fr) 104px 18px; gap: 10px; align-items: center; padding: 10px 14px; }
  .tt-head { font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); }
  .tt-head .r, .tt-amt { text-align: right; }
  .tt-item + .tt-item { border-top: 1px solid var(--line); }
  .tt-row { width: 100%; min-height: 48px; border: 0; border-radius: 0; background: none; color: inherit; text-align: left; font-size: 14px; font-weight: 400; }
  .tt-row:hover { background: var(--soft); }
  .tt-name { font-weight: 600; overflow-wrap: anywhere; }
  .tt-count, .tt-rate { color: var(--muted); }
  .tt-amt { font-weight: 600; white-space: nowrap; }
  .tt-arrow { color: var(--muted); text-align: right; }
  .tt-item.open { background: var(--soft); }
  .tt-body { display: grid; gap: 10px; padding: 2px 14px 14px; }
  .tt-body .warn-line { margin: 0; }
  .tt-body > .quiet { justify-self: start; }
  .tt-acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .tt-pay { display: inline-flex; align-items: center; gap: 6px; }
  .tt-pay input { min-height: 44px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: inherit; }
  .tt-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: start; }
  .tt-cols section, .tt-more { display: grid; gap: 6px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
  .tt-cols h3 { font-size: 14px; font-weight: 600; margin: 0; }
  .tt-forms { display: grid; gap: 12px; }
  .tt-forms, .tt-cols section, .tt-more { grid-template-columns: minmax(0, 1fr); min-width: 0; }
  .tt-cols > * { min-width: 0; }
  .tt-forms input, .tt-forms select, .tt-forms textarea { min-height: 40px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: inherit; font: inherit; max-width: 100%; min-width: 0; }
  .tt-forms textarea { width: 100%; min-height: 180px; margin: 6px 0; }
  .tt-card { display: block; width: 100%; max-width: 460px; margin: 0 auto; border: 1px solid var(--line); border-radius: 10px; cursor: zoom-in; }
  .tt-card:not([src]) { display: none; }
  .tt-more summary { font-size: 14px; font-weight: 600; cursor: pointer; }
  .tutor-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .tutor-line select { flex: 1 1 120px; }
  .tutor-line input { flex: 1 1 100px; }
  .tt-pick { min-height: 32px; padding: 2px 10px; border-radius: 16px; font-size: 13px; }
  .tt-days { list-style: none; margin: 0; padding: 0; font-size: 14px; }
  .tt-days li { display: grid; grid-template-columns: 22px 118px 96px minmax(0, 1fr); gap: 6px; padding: 5px 0; border-top: 1px solid var(--line); }
  .tt-days li:first-child { border-top: 0; }
  .tt-days .no { color: var(--muted); }
  .tt-days .off, .tt-days .later { color: var(--muted); }
  .tt-months { margin-bottom: 10px; }
  @media (max-width: 720px) {
    .tt-head { display: none; }
    .tt-row { grid-template-columns: minmax(0, 1fr) auto 14px; grid-template-areas: "name amt arrow" "count st arrow" "rate st arrow"; gap: 2px 10px; padding: 10px 12px; }
    .tt-name { grid-area: name; } .tt-amt { grid-area: amt; } .tt-count { grid-area: count; font-size: 13px; } .tt-rate { grid-area: rate; font-size: 13px; } .tt-st { grid-area: st; justify-self: end; } .tt-arrow { grid-area: arrow; }
    .tt-cols { grid-template-columns: minmax(0, 1fr); }
    .tt-body { padding: 2px 12px 12px; }
    .tt-days li { grid-template-columns: 20px 118px minmax(0, 1fr); }
    .tt-days li > :last-child { grid-column: 2 / -1; font-size: 13px; }
  }
  .names { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 4px; }
  .name { padding: 2px 10px; border-radius: 12px; background: var(--soft); font-size: 13px; }
  .name small { margin-left: 6px; color: var(--muted); font-size: 12px; }
  .name.due { background: var(--warn-soft); color: var(--warn); font-weight: 500; }
  .name.due small { color: inherit; font-weight: 400; }
  /* Reminder bar and the add box on Biến động. */
  .top-note { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 12px; }
  .top-acts { display: flex; gap: 4px; }
  .add-move { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
  .add-move > div { flex: 1 1 280px; }
  .add-move > .add-btns { flex: 0 1 auto; }
  .add-btns { display: flex; flex-wrap: wrap; gap: 8px; }
  #dvChon input { margin-top: 6px; }
  @media (max-width: 760px) {
    .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .fact:nth-child(3) { border-left: 0; }
    .fact:nth-child(n+3) { border-top: 1px solid var(--line); }
    .dot-grid { grid-template-columns: minmax(0, 1fr); gap: 0; }
    .dot-grid .dot-col + .dot-col { margin-top: 0; }
  }

  /* ===== Same look as Quản lí lớp (owner 09/11: "học phí đổi giao diện cho giống phong cách này") ===== */
  :root, :root[data-theme="light"] { --bg: #F1F5F9; --card: #FFFFFF; --ink: #0F172A; --muted: #64748B; --line: #E2E8F0; --soft: #F1F5F9;
    --brand: #4F46E5; --brand-soft: #EEF2FF; --on-brand: #FFFFFF;
    --ok: #16A34A; --ok-soft: #DCFCE7; --warn: #B45309; --warn-soft: #FEF3C7; --bad: #E11D48; --bad-soft: #FFE4E6;
    --shadow: 0 4px 12px rgba(15, 23, 42, .06);
    --k-ielts: #7C3AED; --k-kids: #0284C7; --k-ta: #059669; --k-tutor: #D97706; --k-fighter: #DB2777; --k-other: #475569; }
  :root[data-theme="dark"] { --bg: #0B1120; --card: #131C2E; --ink: #E2E8F0; --muted: #94A3B8; --line: #243047; --soft: #1B2538;
    --brand: #818CF8; --brand-soft: #1E1B4B; --on-brand: #0B1120;
    --ok: #4ADE80; --ok-soft: #052E16; --warn: #FBBF24; --warn-soft: #3A2A0A; --bad: #FB7185; --bad-soft: #3B0A1A;
    --shadow: none;
    --k-ielts: #A78BFA; --k-kids: #38BDF8; --k-ta: #34D399; --k-tutor: #FBBF24; --k-fighter: #F472B6; --k-other: #94A3B8; }
  body { font-family: "Inter", "Be Vietnam Pro", Arial, sans-serif; }
  .card { box-shadow: var(--shadow); }
  /* Header: dark when opened on its own, light inside Quản lí lớp */
  html:not(.framed) header { background: #0F172A; border-bottom: 1px solid rgba(255, 255, 255, .06); }
  html:not(.framed) .brand { color: #fff; }
  html:not(.framed) .tabs { background: rgba(255, 255, 255, .06); }
  html:not(.framed) .tabs button { color: #94A3B8; }
  html:not(.framed) .tabs button:hover { color: #fff; }
  html:not(.framed) #lop { background: rgba(255, 255, 255, .06); border-color: rgba(255, 255, 255, .16); color: #fff; }
  html:not(.framed) #lop option { color: #0F172A; background: #fff; }
  html:not(.framed) #reload { background: rgba(255, 255, 255, .06); border-color: rgba(255, 255, 255, .16); color: #fff; }
  html:not(.framed) #btnTheme, html:not(.framed) #btnOut { color: #E2E8F0; }
  html:not(.framed) #btnTheme:hover, html:not(.framed) #btnOut:hover { background: rgba(255, 255, 255, .08); }
  .brand i { background: linear-gradient(135deg, #6366F1, #4F46E5); color: #fff; }
  .tabs button[aria-current="true"] { background: #4F46E5; color: #fff; box-shadow: 0 0 0 1px rgba(129, 140, 248, .55), 0 4px 16px rgba(79, 70, 229, .45); }
  #btnTheme { display: inline-grid; place-items: center; min-width: 36px; }
  #btnTheme svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  /* KPI tiles and number boxes */
  .tiles { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .tile { position: relative; min-height: 92px; padding: 14px 16px; border: 1px solid var(--line); background: var(--card); }
  .tile b { font-size: 30px; font-weight: 800; letter-spacing: -.02em; color: var(--brand); }
  .tile span { font-weight: 600; }
  .tile.alert { background: var(--card); border-color: var(--line); border-left: 4px solid var(--bad); }
  .tile.alert b { color: var(--bad); }
  .tile:hover { border-color: color-mix(in srgb, var(--ink) 20%, var(--line)); box-shadow: 0 8px 20px -8px rgba(15, 23, 42, .18); }
  .stats { gap: 10px; }
  .stat { padding: 14px 16px; border-top: 4px solid var(--brand); }
  .stat b { font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
  .stat span { font-weight: 600; }
  .stat.t-red { border-top-color: var(--bad); } .stat.t-red b { color: var(--bad); }
  .stat.t-amber { border-top-color: #F59E0B; } .stat.t-amber b { color: var(--warn); }
  .stat.t-green { border-top-color: var(--ok); } .stat.t-green b { color: var(--ok); }
  .stat.t-indigo { border-top-color: var(--brand); } .stat.t-indigo b { color: var(--brand); }
  .stat.alert b { color: var(--bad); }
  /* Class cards */
  .class { border: 1px solid var(--line); border-top: 4px solid var(--k-other); background: var(--card); }
  .class.k-kids { border-top-color: var(--k-kids); } .class.k-ielts { border-top-color: var(--k-ielts); } .class.k-fighter { border-top-color: var(--k-fighter); } .class.k-ta { border-top-color: var(--k-ta); } .class.k-tutor { border-top-color: var(--k-tutor); }
  .class b { font-size: 17px; font-weight: 800; }
  .class:hover { border-color: color-mix(in srgb, var(--ink) 20%, var(--line)); box-shadow: 0 8px 20px -8px rgba(15, 23, 42, .18); }
  .track { height: 8px; border-radius: 99px; } .track i { border-radius: 99px; background: linear-gradient(90deg, #4ADE80, #16A34A); }
  .class .flag { color: var(--bad); font-weight: 600; }
  /* Rows, chips, buttons */
  .row { border: 1px solid var(--line); }
  .row .amt { font-size: 16px; font-weight: 800; }
  .chip { padding: 2px 10px; border-radius: 99px; font-size: 12.5px; font-weight: 700; }
  :root:not([data-theme="dark"]) .chip { background: #FEF3C7; color: #92400E; }
  :root:not([data-theme="dark"]) .chip.ok { background: #DCFCE7; color: #166534; }
  .chip.idle { background: var(--soft); color: var(--muted); }
  .tick { background: #16A34A; border-color: #16A34A; color: #fff; }
  .primary { background: #4F46E5; border-color: #4F46E5; color: #fff; }
  :root[data-theme="dark"] .primary { background: #6366F1; border-color: #6366F1; }
  .act { background: var(--brand-soft); border-color: transparent; color: var(--brand); font-weight: 700; }
  .act:hover { border-color: var(--brand); }
  .seg { background: var(--soft); border: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: #4F46E5; color: #fff; box-shadow: 0 2px 8px rgba(79, 70, 229, .35); }
  .filters button[aria-pressed="true"] { background: #4F46E5; border-color: #4F46E5; color: #fff; }
  .page-title h1 { font-size: 24px; font-weight: 800; letter-spacing: -.01em; }
  .section, .panel-title { font-weight: 800; }
  .warn-line { border-left: 4px solid #F59E0B; }
  .due-banner { border-left: 4px solid #F59E0B; }
  .notice.err { border-left: 4px solid var(--bad); }

  /* Money cards, fee table, drawer (owner 09/11) */
  .kpi4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
  .kpi4c { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); box-shadow: var(--shadow); min-width: 0; }
  .kpi4c > div { display: grid; min-width: 0; }
  .kpi4l { font-size: 12px; font-weight: 700; color: var(--muted); }
  .kpi4c b { font-size: 26px; font-weight: 800; line-height: 1.15; letter-spacing: -.02em; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi4c small { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi4i { flex: none; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: #fff; }
  .kpi4i svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .t-indigo .kpi4i { background: linear-gradient(135deg, #6366F1, #4F46E5); } .t-green .kpi4i { background: linear-gradient(135deg, #4ADE80, #16A34A); }
  .t-amber .kpi4i { background: linear-gradient(135deg, #FBBF24, #D97706); } .t-red .kpi4i { background: linear-gradient(135deg, #FB7185, #E11D48); }
  .kpi4c.t-green b { color: #16A34A; } .kpi4c.t-amber b { color: #D97706; } .kpi4c.t-red b { color: #E11D48; }
  :root[data-theme="dark"] .kpi4c.t-green b { color: #4ADE80; } :root[data-theme="dark"] .kpi4c.t-amber b { color: #FBBF24; } :root[data-theme="dark"] .kpi4c.t-red b { color: #FB7185; }
  .ft-search { margin: 0 0 10px; }
  .ft { border: 1px solid var(--line); border-radius: 14px; background: var(--card); box-shadow: var(--shadow); overflow: clip; }
  .ft-head, .ft-row { display: grid; grid-template-columns: minmax(0, 1fr) 140px 130px auto; align-items: center; gap: 12px; padding: 0 14px; }
  .ft-head { position: sticky; top: 62px; z-index: 2; min-height: 38px; background: #F8FAFC; color: #64748B; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; border-bottom: 1px solid var(--line); }
  :root[data-theme="dark"] .ft-head { background: var(--soft); color: var(--muted); }
  .ft-head span:nth-child(2) { text-align: right; }
  @media (max-width: 960px) { .ft-head { top: 112px; } }
  .ft-row { min-height: 56px; border-top: 1px solid var(--line); }
  .ft-head + .ft-row { border-top: 0; }
  .ft-row:hover { background: color-mix(in srgb, var(--soft) 70%, transparent); }
  .ft-who { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .ft-who > i { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 800 14px/1 "Inter", system-ui, sans-serif; font-style: normal; }
  .ft-who > span { display: grid; min-width: 0; }
  .ft-who b { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ft-who small { font-size: 12px; color: var(--muted); }
  .ft-amt { text-align: right; font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ft-row.paid .ft-amt { color: var(--muted); }
  .pill { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 99px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  .p-ok { background: #DCFCE7; color: #15803D; } .p-wait { background: #FEF9C3; color: #A16207; } .p-bad { background: #FEE2E2; color: #B91C1C; } .p-idle { background: var(--soft); color: var(--muted); }
  :root[data-theme="dark"] .p-ok { background: #052E16; color: #4ADE80; } :root[data-theme="dark"] .p-wait { background: #3A2A0A; color: #FDE047; } :root[data-theme="dark"] .p-bad { background: #3B0A1A; color: #FCA5A5; }
  .ft-go { white-space: nowrap; font-weight: 700; }
  .dw-veil { position: fixed; inset: 0; z-index: 40; background: rgba(15, 23, 42, .35); }
  .drawer { position: fixed; z-index: 41; top: 0; right: 0; bottom: 0; width: min(460px, 100vw); display: flex; flex-direction: column; background: var(--bg); box-shadow: -12px 0 32px rgba(15, 23, 42, .25); animation: dwIn .2s ease-out; }
  @keyframes dwIn { from { transform: translateX(40px); opacity: .6; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .drawer { animation: none; } }
  .dw-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--card); border-bottom: 1px solid var(--line); }
  .dw-body { flex: 1; overflow: auto; padding: 12px; }
  .dw-body .row { margin: 0; }
  @media (max-width: 760px) {
    .kpi4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .kpi4c { padding: 10px; gap: 10px; } .kpi4c b { font-size: 19px; } .kpi4i { width: 36px; height: 36px; }
    .ft-head { display: none; }
    .ft-row { grid-template-columns: minmax(0, 1fr) auto; row-gap: 4px; padding: 10px 12px; }
    .ft-amt { grid-column: 2; grid-row: 1; } .ft-st { grid-column: 1; grid-row: 2; padding-left: 44px; } .ft-go { grid-column: 2; grid-row: 2; justify-self: end; }
  }
  /* Owner 09/11 (photo of Học phí inside Quản lí lớp): "cho tràn ra hết". Inside the class app the page uses the full width, and
     money cards never cut a number with "…": the cards wrap to the next line and the figure shrinks a little when needed. */
  html.framed .bar, html.framed main { max-width: none; }
  html.framed main { padding: 12px 20px 32px; }
  .kpi4 { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
  .kpi4c b { font-size: clamp(19px, 1vw + 12px, 26px); overflow: visible; text-overflow: clip; }
  .kpi4c small { white-space: normal; }
</style>
</head>
<body>
<div id="login">
  <div class="login-box card">
    <div class="logo" aria-hidden="true">₫</div>
    <h1>Học phí</h1>
    <p>Mở bằng link riêng cô Trang đã gửi cho bạn, không cần đăng nhập.</p>
    <details style="margin-top:12px"><summary class="sub">Dự phòng: đăng nhập Google</summary>
    <button id="btnLogin" class="primary" disabled style="margin-top:8px">Đăng nhập Google</button></details>
    <p id="loginMsg" role="status"></p>
  </div>
</div>
<div id="app" hidden>
  <header>
    <div class="bar">
      <button id="home" class="brand" aria-label="Về trang tổng quan"><i aria-hidden="true">₫</i><span>Học phí</span></button>
      <nav class="tabs" aria-label="Các trang">
        <button id="navHome">Tổng quan</button>
        <button id="btnCal">Lịch thu</button>
        <button id="navLop">Các lớp</button>
        <button id="navTutor">Tutor</button>
        <button id="btnMoves">Biến động</button>
        <button id="navNguoi" hidden>Người dùng</button>
      </nav>
      <div class="spacer"></div>
      <select id="lop" aria-label="Mở nhanh một lớp"></select>
      <button id="reload" aria-label="Tải lại số mới" title="Tải lại số mới">↻ Tải lại</button>
      <button id="btnTheme" class="quiet" style="white-space:nowrap"></button>
      <button id="btnOut" class="quiet">Đăng xuất</button>
    </div>
  </header>
  <main>
    <div class="notices" id="notices"></div>
    <div id="view"></div>
  </main>
</div>
<dialog id="sua" aria-labelledby="suaTen">
  <h2 id="suaTen"></h2>
  <label for="edMsg">Tin nhắn riêng cho em này</label>
  <textarea id="edMsg"></textarea>
  <label for="edAmt">Số tiền riêng (để trống là giữ số tự tính)</label>
  <input id="edAmt" inputmode="numeric" placeholder="Ví dụ 2500000">
  <div class="hint" id="edHint"></div>
  <div class="acts">
    <button id="edLuu" class="primary">Lưu</button>
    <button id="edBo">Dùng lại tin tự động</button>
    <button id="edHuy">Huỷ</button>
  </div>
  <div id="edErr" role="status"></div>
</dialog>
<dialog id="duyet" aria-labelledby="dvTen">
  <h2 id="dvTen"></h2>
  <div class="sub" id="dvRoute"></div>
  <div id="dvChon" hidden></div>
  <label for="dvDate" id="dvDateLabel">Ngày</label>
  <input id="dvDate" type="date">
  <label>Sách, tài liệu (nếu có)</label>
  <div id="dvBooks" class="books"></div>
  <label>Giảm giá (nếu có)</label>
  <div id="dvDisc"></div>
  <div class="hint" id="dvStatus" role="status"></div>
  <div class="hint" id="dvAcc"></div>
  <div class="acts">
    <button id="dvKhongThu" hidden>Đã đóng, không thu</button>
    <button id="dvLuu" class="primary">Thêm vào danh sách thu</button>
    <button id="dvHuy">Huỷ</button>
  </div>
  <div id="dvErr" role="status"></div>
</dialog>
<dialog id="taoLop" aria-labelledby="tlTen">
  <h2 id="tlTen">Tạo lớp mới</h2>
  <div id="tlForm"></div>
  <div class="hint" id="tlStatus" role="status"></div>
  <div class="acts">
    <button id="tlLuu" class="primary">Tạo lớp</button>
    <button id="tlMo" class="primary" hidden>Mở Sheet, tick ô tạo lớp</button>
    <button id="tlHuy">Đóng</button>
  </div>
  <div id="tlErr" role="status"></div>
</dialog>
<dialog id="thiepDlg" aria-labelledby="thiepTen">
  <h2 id="thiepTen"></h2>
  <div class="pv"><img id="thiepAnh" alt="Thiệp học phí"></div>
  <div class="acts">
    <button id="thiepCopy" class="primary">Copy thiệp</button>
    <button id="thiepDong">Đóng</button>
  </div>
  <div class="st" id="thiepSt" role="status"></div>
</dialog>
<script src="config.js"></script>
<script src="logic.js"></script>
<script src="app.js"></script>
<script src="https://accounts.google.com/gsi/client" async></script>
</body>
</html>
